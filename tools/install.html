<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install R1 Probe</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 32px 16px;
    background: #fff; color: #18181b;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d0d0f; color: #e8e8ea; }
    pre { background: #1c1c22 !important; border-color: #33333c !important; }
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  p  { margin: 0; color: #71717a; font-size: 13px; text-align: center; max-width: 46ch; }
  .card {
    background: #fff; padding: 16px; border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,.2);
  }
  .card svg { display: block; width: 300px; height: 300px; }
  #url {
    width: min(520px, 100%); padding: 9px 11px; border-radius: 7px;
    border: 1px solid #3f3f46; background: transparent; color: inherit;
    font: 13px ui-monospace, Menlo, Consolas, monospace;
  }
  pre {
    width: min(520px, 100%); margin: 0; padding: 11px; overflow-x: auto;
    background: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 7px;
    font: 11.5px/1.45 ui-monospace, Menlo, Consolas, monospace;
  }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; text-align: center; }
</style>
</head>
<body>
  <h1>Install R1 Probe</h1>
  <p>Scan with the r1 camera to install. Edit the URL to regenerate.</p>

  <input id="url" value="https://playful-begonia-6999ab.netlify.app/" spellcheck="false">
  <div class="card" id="card"></div>
  <div id="err" class="err"></div>
  <pre id="payload"></pre>

  <script src="qrcode.js"></script>
  <script>
  (function () {
    var input = document.getElementById("url");
    var card  = document.getElementById("card");
    var out   = document.getElementById("payload");
    var err   = document.getElementById("err");

    function render() {
      var payload = {
        title: "R1 Probe",
        url: input.value.trim(),
        description: "device capability probe",
        iconUrl: "",
        themeColor: "#F59E0B"
      };
      var json = JSON.stringify(payload);
      out.textContent = JSON.stringify(payload, null, 2);

      if (typeof qrcode !== "function") {
        err.textContent = "qrcode.js failed to load — is it next to this file?";
        card.innerHTML = "";
        return;
      }
      try {
        var qr = qrcode(0, "M");        // 0 = auto-size
        qr.addData(json);
        qr.make();
        card.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
        err.textContent = "";
      } catch (e) {
        card.innerHTML = "";
        err.textContent = "QR error: " + (e && e.message ? e.message : String(e));
      }
    }

    input.addEventListener("input", render);
    render();
  })();
  </script>
</body>
</html>
