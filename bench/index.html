<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BirdNET bench</title>
<!-- Bump on every push. Pages sends Cache-Control: max-age=600, so a relaunch
     within 10 minutes serves stale HTML and looks like a broken build. -->
<meta name="build" content="b1">
<script>window.__BUILD = "b1";</script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #111; color: #e8c9a0;
    font: 10px/1.35 'Courier New', Courier, monospace;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  /* Header sits outside #log because bench() clears the log, and the build
     stamp must stay visible exactly when you are debugging a run. */
  #hdr { flex: 0 0 auto; padding: 3px 5px; border-bottom: 1px solid #2a2620; }
  #hdr div { white-space: pre-wrap; }
  #log { flex: 1; overflow-y: auto; padding: 4px 5px; }
  #log div { white-space: pre-wrap; word-break: break-word; }
  .ok   { color: #8fdc8f; }
  .err  { color: #e06363; }
  .hot  { color: #ffd166; font-weight: bold; }
  .dim  { color: #8a7a66; }
  #go, #offline {
    flex: 0 0 auto; margin: 0; border: 0; padding: 9px 0;
    background: #F59E0B; color: #111;
    font: bold 12px 'Courier New', Courier, monospace;
  }
  #offline {
    padding: 6px 0; background: #2a2620; color: #F59E0B;
    border-top: 1px solid #4a4136; font-size: 10px;
  }
  #go[disabled], #offline[disabled] { background: #4a4136; color: #8a7a66; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr"></div>
  <div id="log"></div>
  <button id="go">RUN BENCH</button>
  <button id="offline">SAVE FOR OFFLINE</button>
</div>
<script>
// Bench harness for BirdNET V2.4 on the r1's WebGL path.
// Replaces georg95/birdnet-web's test-chirpity.html, which hangs twice over:
// once on a null ?lang= in the worker, once on an audioBuf/pcmAudio field
// mismatch. Every await here is watchdogged so a hang names its own stage.

var RUNS = 5
var WAVE = './test-audio.json'          // mirrored; cross-origin can't be cached
var MODEL = '../models/birdnet/'
var logEl = document.getElementById('log')
var goEl = document.getElementById('go')
var offlineEl = document.getElementById('offline')

function line(text, cls) {
  var d = document.createElement('div')
  if (cls) { d.className = cls }
  d.textContent = text
  logEl.appendChild(d)
  logEl.scrollTop = logEl.scrollHeight
  return d
}
function ms(n) { return Math.round(n) + 'ms' }

// Nothing may await forever: an expired stage prints what it was waiting on.
function watchdog(promise, stage, limitMs) {
  return new Promise(function (resolve, reject) {
    var timer = setTimeout(function () {
      reject(new Error('TIMEOUT after ' + (limitMs / 1000) + 's waiting for: ' + stage))
    }, limitMs)
    promise.then(function (v) { clearTimeout(timer); resolve(v) },
                 function (e) { clearTimeout(timer); reject(e) })
  })
}

function bench() {
  logEl.innerHTML = ''
  goEl.disabled = true

  var worker = new Worker('birdnet-worker.js')
  var waiters = {}
  var lastProgress = null

  // One dispatcher: worker errors reject whatever stage is currently pending,
  // so a failure surfaces as a message instead of a silent stall.
  worker.addEventListener('message', function (ev) {
    var d = ev.data
    if (d.message === 'error') {
      Object.keys(waiters).forEach(function (k) {
        waiters[k].reject(new Error('worker/' + d.where + ': ' + d.error))
      })
      return
    }
    if (d.message === 'load_progress') {
      var pct = Math.round(d.progress * 100) + '%'
      if (lastProgress) { lastProgress.textContent = '  downloading model ' + pct }
      else { lastProgress = line('  downloading model ' + pct, 'dim') }
      return
    }
    if (d.message === 'run') {
      line('  run ' + d.index + '/' + d.of + ': ' + ms(d.ms), 'hot')
      return
    }
    if (waiters[d.message]) { waiters[d.message].resolve(d) }
  })
  worker.addEventListener('error', function (e) {
    Object.keys(waiters).forEach(function (k) {
      waiters[k].reject(new Error('worker failed to load: ' + e.message))
    })
  })

  function expect(name, stage, limitMs) {
    return watchdog(new Promise(function (resolve, reject) {
      waiters[name] = { resolve: resolve, reject: reject }
    }), stage, limitMs)
  }

  function step(label, name, stage, limitMs) {
    var el = line(label + '... ')
    return expect(name, stage, limitMs).then(function (d) {
      el.textContent = label + '... ' + (d.ms !== undefined ? ms(d.ms) : '') + ' [OK]'
      el.className = 'ok'
      return d
    })
  }

  var t0 = performance.now()

  step('backend', 'backend', 'tf.setBackend(webgl)', 30000)
    .then(function (d) {
      line('  -> ' + d.backend + ' v' + d.webglVersion, 'dim')
      line('  -> render f32 ' + d.renderF32 + ', force f16 ' + d.forceF16,
           d.renderF32 === 'true' ? 'dim' : 'err')
      line('  -> download f32 ' + d.downloadF32, 'dim')
      return expect('precision', 'gpu precision probe', 60000)
    })
    .then(function (d) {
      if (d.renderer) { line('  -> ' + d.renderer, 'dim') }
      // 23 mantissa bits = fp32 ALU, 10 = fp16. Desktop reference below is an
      // RTX 4090; cos error at 3000 rad is range-reduction loss that even a
      // desktop GPU shows, so only a much larger value is a real signal.
      line('  -> shader mantissa: highp ' + d.highp + 'b, mediump ' + d.mediump + 'b'
           + '  (ref 23b)', d.highp >= 23 ? 'dim' : 'err')
      line('  -> cos err ' + d.cosErrSmall.toExponential(1) + ' @2pi (ref 6.4e-7)',
           d.cosErrSmall > 1e-4 ? 'err' : 'dim')
      line('  -> cos err ' + d.cosErrLarge.toExponential(1) + ' @3000rad (ref 2.9e-4)',
           d.cosErrLarge > 1e-2 ? 'err' : 'dim')
      line('  -> pow rel err ' + d.powErr.toExponential(1) + ' (ref 1.3e-7)',
           d.powErr > 1e-4 ? 'err' : 'dim')
      // Scored against an exact fp64 DFT, so this is accuracy, not just
      // agreement with some other GPU. fp32 floor is ~1e-7.
      line('  -> stft err vs exact ' + d.stftRelErr.toExponential(1),
           d.stftRelErr > 1e-5 ? 'err' : 'dim')
      line('  -> stft checksum ' + d.stft.toFixed(3), 'dim')
      return step('labels', 'labels', 'label list fetch', 60000)
    })
    .then(function (d) {
      line('  -> ' + d.count + ' species', 'dim')
      // 52 MB unquantized over the r1's wifi; give it room.
      return step('model', 'model', 'model download + parse', 300000)
    })
    .then(function () {
      // The interesting one: shader compile on the GE8320, measured alone.
      return step('warmup', 'warmup', 'shader compile / first pass', 180000)
    })
    .then(function () {
      return expect('ready', 'worker ready', 10000)
    })
    .then(function () {
      var el = line('audio... ')
      return watchdog(fetch(WAVE).then(function (r) {
                        if (!r.ok) { throw new Error('wave.json ' + r.status) }
                        return r.json()
                      }), 'wave.json download', 120000)
        .then(function (wave) {
          el.textContent = 'audio... ' + wave.length + ' samples [OK]'
          el.className = 'ok'
          line('inference x' + RUNS + '...')
          worker.postMessage({ message: 'bench', pcmAudio: wave, runs: RUNS })
          return expect('done', 'inference runs', 600000)
        })
    })
    .then(function (d) {
      line('')
      line('===== ms/chunk (3s audio)', 'hot')
      line('min    ' + ms(d.min), 'hot')
      line('median ' + ms(d.median), 'hot')
      line('max    ' + ms(d.max), 'hot')
      line('realtime x' + (3000 / d.median).toFixed(2), 'hot')
      line('')
      line('===== top species')
      if (!d.top.length) { line('(nothing over 0.1)', 'dim') }
      d.top.forEach(function (b) {
        line(b.name + '  ' + b.confidence.toFixed(2))
      })
      line('')
      line('total ' + ms(performance.now() - t0), 'dim')
    })
    .catch(function (e) {
      line('')
      line('FAILED: ' + (e && e.message ? e.message : String(e)), 'err')
    })
    .then(function () {
      goEl.disabled = false
    })
}

// pointerdown, never touchstart, and no preventDefault anywhere — see README.
goEl.addEventListener('pointerdown', bench)

/* ---------- offline ---------- */

// Register the SW immediately so a first online run caches the shell.
if (navigator.serviceWorker) {
  navigator.serviceWorker.register('sw.js').catch(function (e) {
    line('SW register failed: ' + (e && e.message || e), 'err')
  })
}

// Build stamp: a stale cached page is indistinguishable from a broken one
// unless the page says which build it is. See README.
;(function () {
  function hdr(text, cls) {
    var d = document.createElement('div')
    d.textContent = text
    if (cls) { d.className = cls }
    document.getElementById('hdr').appendChild(d)
    return d
  }
  var el = hdr('build ' + window.__BUILD + ' — checking', 'dim')
  fetch('./index.html?cb=' + Math.random(), { cache: 'no-store' })
    .then(function (r) { return r.text() })
    .then(function (h) {
      var m = h.match(/name="build" content="([^"]+)"/)
      var latest = m ? m[1] : '?'
      var stale = latest !== window.__BUILD
      el.textContent = 'build ' + window.__BUILD + (stale ? ' STALE — latest ' + latest : ' (current)')
      el.className = stale ? 'err' : 'dim'
    })
    .catch(function () {
      el.textContent = 'build ' + window.__BUILD + ' (offline, unverified)'
    })
  hdr(navigator.onLine ? 'online' : 'OFFLINE — using cache', navigator.onLine ? 'dim' : 'hot')
})()

// Explicit download of the 49 MB model. The SW caches opportunistically on a
// normal run too, but in the field you want to choose when to spend the
// bandwidth rather than discover it missing with no signal.
function saveOffline() {
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) {
    line('no SW controller yet — reload once, then retry', 'err')
    return
  }
  offlineEl.disabled = true
  var el = line('caching model...', 'hot')

  fetch(MODEL + 'model.json').then(function (r) { return r.json() }).then(function (m) {
    var urls = [MODEL + 'model.json', MODEL + 'labels/en_us.txt', WAVE]
    m.weightsManifest.forEach(function (g) {
      g.paths.forEach(function (p) { urls.push(MODEL + p) })
    })

    var ch = new MessageChannel()
    ch.port1.onmessage = function (ev) {
      var d = ev.data
      if (d.error) { line('  ' + d.error, 'err') }
      el.textContent = 'caching model... ' + d.done + '/' + d.total
      if (d.finished) {
        var ok = d.done === d.total
        el.textContent = ok
          ? 'cached ' + d.done + '/' + d.total + ' — works offline now'
          : 'cached ' + d.done + '/' + d.total + ' — INCOMPLETE'
        el.className = ok ? 'ok' : 'err'
        offlineEl.disabled = false
      }
    }
    navigator.serviceWorker.controller.postMessage(
      { type: 'precache-model', urls: urls }, [ch.port2])
  }).catch(function (e) {
    el.textContent = 'failed: ' + (e && e.message || e)
    el.className = 'err'
    offlineEl.disabled = false
  })
}
offlineEl.addEventListener('pointerdown', saveOffline)
</script>
</body>
</html>
