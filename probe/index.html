<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R1 Probe</title>
<script>
  /* Captured before this page defines any globals of its own, so anything
     here that a clean about:blank window lacks was injected by the host. */
  window.__atStart = Object.getOwnPropertyNames(window);
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #0d0d0f; color: #e8e8ea;
    font: 11px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow-x: hidden;
  }
  #app { padding: 6px 7px 40px; }
  h1 {
    font-size: 12px; margin: 0 0 6px; letter-spacing: .04em;
    color: #F59E0B; text-transform: uppercase;
  }
  section { margin: 0 0 8px; }
  h2 {
    font-size: 10px; margin: 0 0 3px; padding-bottom: 2px;
    color: #9a9aa2; text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid #26262c;
  }
  .row { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; }
  .k { color: #7d7d86; flex: 0 0 auto; }
  .v { margin-left: auto; text-align: right; word-break: break-word; }
  .ok   { color: #4ade80; }
  .bad  { color: #f87171; }
  .warn { color: #fbbf24; }
  button {
    display: block; width: 100%; margin: 4px 0;
    padding: 7px 6px; font: inherit; font-size: 11px;
    background: #1c1c22; color: #F59E0B;
    border: 1px solid #33333c; border-radius: 5px;
  }
  button:active { background: #2a2a33; }
  button[disabled] { opacity: .45; color: #7d7d86; }
  #evt {
    min-height: 15px; color: #4ade80; font-size: 10px;
    padding: 2px 0; word-break: break-word;
  }
  .note { color: #6b6b74; font-size: 9.5px; padding: 2px 0; }
</style>
</head>
<body>
<div id="app">
  <h1>R1 Probe</h1>

  <section><h2>Display</h2><div id="s-display"></div></section>
  <section><h2>Viewport over time</h2><div id="s-vp"></div></section>
  <section><h2>Injected globals</h2><div id="s-inj"></div></section>
  <section><h2>SDK layer</h2><div id="s-sdk"></div></section>
  <section><h2>Offline / persistence</h2><div id="s-off"></div></section>
  <section><h2>Engine</h2><div id="s-engine"></div></section>
  <section><h2>WASM</h2><div id="s-wasm"></div></section>
  <section><h2>Graphics</h2><div id="s-gfx"></div></section>
  <section><h2>Rabbit API</h2><div id="s-rabbit"></div></section>

  <section>
    <h2>CPU Bench</h2>
    <div id="s-cpu"><div class="note">Estimates inference headroom.</div></div>
    <button id="b-cpu">Run CPU benchmark</button>
  </section>

  <section>
    <h2>Storage</h2>
    <div id="s-store"></div>
    <button id="b-store">Test IndexedDB (8&nbsp;MB)</button>
  </section>

  <section>
    <h2>Audio</h2>
    <div id="s-audio"></div>
    <button id="b-audio">Test microphone</button>
  </section>

  <section>
    <h2>Camera</h2>
    <div id="s-cam"></div>
    <button id="b-cam">Enumerate cameras</button>
  </section>

  <section>
    <h2>Hardware events</h2>
    <div id="evt">press PTT / scroll wheel…</div>
  </section>
</div>

<script>
(function () {
  "use strict";

  function row(host, k, v, cls) {
    var d = document.createElement("div");
    d.className = "row";
    var a = document.createElement("span"); a.className = "k"; a.textContent = k;
    var b = document.createElement("span"); b.className = "v " + (cls || ""); b.textContent = v;
    d.appendChild(a); d.appendChild(b);
    document.getElementById(host).appendChild(d);
    return d;
  }
  function clear(host) { document.getElementById(host).innerHTML = ""; }
  function yn(v) { return v ? "yes" : "no"; }
  function cls(v) { return v ? "ok" : "bad"; }
  function mb(bytes) { return (bytes / 1048576).toFixed(1) + " MB"; }

  /* ---------- display ---------- */
  row("s-display", "viewport", window.innerWidth + "x" + window.innerHeight);
  row("s-display", "screen", screen.width + "x" + screen.height);
  row("s-display", "dpr", String(window.devicePixelRatio));

  /* ---------- engine ---------- */
  var ua = navigator.userAgent;
  var chrome = (ua.match(/Chrome\/(\d+)/) || [])[1] || "n/a";
  var android = (ua.match(/Android (\d+)/) || [])[1] || "n/a";
  row("s-engine", "chrome", chrome);
  row("s-engine", "android", android);
  row("s-engine", "cores", String(navigator.hardwareConcurrency || "n/a"));
  row("s-engine", "deviceMemory", (navigator.deviceMemory || "n/a") + " GB");
  row("s-engine", "coi", yn(window.crossOriginIsolated), cls(window.crossOriginIsolated));
  row("s-engine", "secureCtx", yn(window.isSecureContext), cls(window.isSecureContext));

  /* ---------- wasm ---------- */
  var hasWasm = typeof WebAssembly === "object";
  row("s-wasm", "wasm", yn(hasWasm), cls(hasWasm));

  // v128 SIMD probe
  var simd = false;
  try {
    simd = WebAssembly.validate(new Uint8Array([
      0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,
      10,10,1,8,0,65,0,253,15,253,98,11
    ]));
  } catch (e) { simd = false; }
  row("s-wasm", "SIMD", yn(simd), cls(simd));

  var sab = typeof SharedArrayBuffer !== "undefined";
  row("s-wasm", "SharedArrayBuf", yn(sab), cls(sab));
  row("s-wasm", "threads", yn(sab && window.crossOriginIsolated),
      cls(sab && window.crossOriginIsolated));

  /* ---------- graphics ---------- */
  var gl = null;
  try {
    var c = document.createElement("canvas");
    gl = c.getContext("webgl2") ? "webgl2" : (c.getContext("webgl") ? "webgl" : null);
  } catch (e) {}
  row("s-gfx", "webgl", gl || "none", cls(!!gl));
  row("s-gfx", "webgpu", yn(!!navigator.gpu), cls(!!navigator.gpu));

  /* offline-capability surface — nobody in the ecosystem has used these */
  row("s-engine", "cachesAPI", yn(!!window.caches), cls(!!window.caches));
  row("s-engine", "serviceWkr", yn(!!navigator.serviceWorker), cls(!!navigator.serviceWorker));
  row("s-engine", "indexedDB", yn(!!window.indexedDB), cls(!!window.indexedDB));

  /* ---------- rabbit api surface ---------- */
  [
    ["PluginMessageHandler", window.PluginMessageHandler],
    ["CreationVoiceHandler", window.CreationVoiceHandler],
    ["creationStorage",      window.creationStorage],
    ["creationSensors",      window.creationSensors],
    ["TouchEventHandler",    window.TouchEventHandler],
    ["closeWebView",         window.closeWebView]
  ].forEach(function (p) {
    row("s-rabbit", p[0], yn(!!p[1]), cls(!!p[1]));
  });

  /* Re-check by name over time. A WebView can attach interfaces after the
     first script runs, in which case a one-shot check reports them absent. */
  (function () {
    var names = ["PluginMessageHandler", "CreationVoiceHandler", "creationStorage",
                 "creationSensors", "TouchEventHandler", "closeWebView"];
    var late = row("s-rabbit", "late arrivals", "watching...", "warn");
    function recheck(ms) {
      var found = names.filter(function (n) { return !!window[n]; });
      late.lastChild.textContent = "@" + ms + "ms: " + found.length + "/" + names.length;
      late.lastChild.className = "v " + (found.length === names.length ? "ok" : "warn");
    }
    [500, 2000, 5000].forEach(function (ms) {
      setTimeout(function () { recheck(ms); }, ms);
    });
  })();

  /* ---------- SDK wrapper layer ----------
     The *Handler globals are low-level Flutter bridges. rabbit's own SDK demo
     (rabbit-hmi-oss/creations-sdk) bundles no shim and calls window.creation*
     directly, so the wrappers are meant to be host-injected too. Its own code
     still guards with `typeof window.creationSensors === 'undefined'`, so
     absence is a known state. This checks whether they turn up at all, then
     proves storage with a real round-trip rather than a presence check. */
  (function () {
    var wrappers = ["creationStorage", "creationSensors"];
    var rows = {};
    wrappers.forEach(function (n) {
      rows[n] = row("s-sdk", n, "absent @0ms", "bad");
    });
    var firstSeen = {};
    var storageRow = row("s-sdk", "storage round-trip", "waiting for API", "warn");
    var accelRow = row("s-sdk", "accel isAvailable", "waiting for API", "warn");
    var done = false;

    function proveStorage() {
      var s = window.creationStorage && window.creationStorage.plain;
      if (!s || !s.setItem) {
        storageRow.lastChild.textContent = "no plain.setItem";
        storageRow.lastChild.className = "v bad";
        return;
      }
      var key = "__probe_roundtrip";
      var val = btoa(JSON.stringify({ t: Date.now() }));
      storageRow.lastChild.textContent = "writing...";
      Promise.resolve(s.setItem(key, val))
        .then(function () { return s.getItem(key); })
        .then(function (got) {
          var ok = got === val;
          storageRow.lastChild.textContent = ok
            ? "OK — persists"
            : "MISMATCH got " + String(got).slice(0, 24);
          storageRow.lastChild.className = "v " + (ok ? "ok" : "bad");
        })
        .catch(function (e) {
          storageRow.lastChild.textContent = "threw: " + (e && e.message || e);
          storageRow.lastChild.className = "v bad";
        });
    }

    function proveAccel() {
      var a = window.creationSensors && window.creationSensors.accelerometer;
      if (!a) {
        accelRow.lastChild.textContent = "no accelerometer";
        accelRow.lastChild.className = "v bad";
        return;
      }
      if (!a.isAvailable) {
        accelRow.lastChild.textContent = "present, no isAvailable()";
        accelRow.lastChild.className = "v warn";
        return;
      }
      Promise.resolve(a.isAvailable())
        .then(function (v) {
          accelRow.lastChild.textContent = yn(v);
          accelRow.lastChild.className = "v " + cls(v);
        })
        .catch(function (e) {
          accelRow.lastChild.textContent = "threw: " + (e && e.message || e);
          accelRow.lastChild.className = "v bad";
        });
    }

    function poll(ms) {
      var all = true;
      wrappers.forEach(function (n) {
        if (window[n]) {
          /* Record FIRST sighting, not the latest poll — how long a creation
             must wait before touching the SDK is the number that matters. */
          if (firstSeen[n] === undefined) { firstSeen[n] = ms; }
          rows[n].lastChild.textContent = "first seen @" + firstSeen[n] + "ms";
          rows[n].lastChild.className = "v ok";
        } else {
          all = false;
          rows[n].lastChild.textContent = "absent through " + ms + "ms";
        }
      });
      if (all && !done) { done = true; proveStorage(); proveAccel(); }
    }
    poll(0);
    [50, 100, 250, 500, 1000, 1500, 2000, 3000, 4000, 6000].forEach(function (ms) {
      setTimeout(function () { poll(ms); }, ms);
    });
    setTimeout(function () {
      if (done) { return; }
      /* Partial availability still worth exercising. */
      if (window.creationStorage) { proveStorage(); }
      else {
        storageRow.lastChild.textContent = "wrapper never appeared";
        storageRow.lastChild.className = "v bad";
      }
      if (window.creationSensors) { proveAccel(); }
      else {
        accelRow.lastChild.textContent = "wrapper never appeared";
        accelRow.lastChild.className = "v bad";
      }
    }, 6500);
  })();

  /* ---------- offline / persistence ----------
     Two questions at once. Can a service worker install and control the page
     (offline shell), and does anything written survive a relaunch? A creation
     is refetched every launch, so a within-session round-trip proves the API
     works but says nothing about whether a collection persists. Each store
     keeps a launch counter: seeing a previous value is the proof. */
  (function () {
    var KEY = "r1probe_launch";

    row("s-off", "navigator.onLine", yn(navigator.onLine), cls(navigator.onLine));

    var ctrl = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
    row("s-off", "SW controlling", ctrl ? "yes (survived launch)" : "no (first load)",
        ctrl ? "ok" : "warn");

    var swRow = row("s-off", "SW register", "registering...", "warn");
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function state() {
          var w = reg.active ? "active" : reg.installing ? "installing"
                : reg.waiting ? "waiting" : "none";
          swRow.lastChild.textContent = w + " " + reg.scope.replace(location.origin, "");
          swRow.lastChild.className = "v " + (reg.active ? "ok" : "warn");
        }
        state();
        setTimeout(state, 1500);
        setTimeout(state, 4000);
      }).catch(function (e) {
        swRow.lastChild.textContent = "FAILED: " + (e && e.message || e);
        swRow.lastChild.className = "v bad";
      });
    } else {
      swRow.lastChild.textContent = "unsupported";
      swRow.lastChild.className = "v bad";
    }

    function mark(name, read, write) {
      var r = row("s-off", name, "...", "warn");
      Promise.resolve().then(read).then(function (prev) {
        var n = (parseInt(prev, 10) || 0) + 1;
        return Promise.resolve(write(String(n))).then(function () {
          var had = prev !== null && prev !== undefined && prev !== "";
          r.lastChild.textContent = had
            ? "SURVIVED prev=" + prev + " now=" + n
            : "first launch (n=1)";
          r.lastChild.className = "v " + (had ? "ok" : "warn");
        });
      }).catch(function (e) {
        r.lastChild.textContent = "err: " + (e && e.message || e);
        r.lastChild.className = "v bad";
      });
    }

    function idb(op, val) {
      return new Promise(function (resolve, reject) {
        var rq = indexedDB.open("r1probe", 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore("kv"); };
        rq.onerror = function () { reject(rq.error); };
        rq.onsuccess = function () {
          var tx = rq.result.transaction("kv", op === "get" ? "readonly" : "readwrite");
          var st = tx.objectStore("kv");
          var r = op === "get" ? st.get(KEY) : st.put(val, KEY);
          r.onsuccess = function () {
            resolve(op === "get" ? (r.result === undefined ? null : r.result) : true);
          };
          r.onerror = function () { reject(r.error); };
        };
      });
    }

    mark("localStorage",
      function () { return localStorage.getItem(KEY); },
      function (v) { localStorage.setItem(KEY, v); });

    mark("indexedDB",
      function () { return idb("get"); },
      function (v) { return idb("put", v); });

    mark("cacheAPI",
      function () {
        if (!window.caches) { throw new Error("no caches"); }
        return caches.open("r1-probe-marker").then(function (c) {
          return c.match(KEY).then(function (res) { return res ? res.text() : null; });
        });
      },
      function (v) {
        return caches.open("r1-probe-marker").then(function (c) {
          return c.put(KEY, new Response(v));
        });
      });

    /* Host-backed store. Late-injected, so wait for it. This is the one that
       matters for the Pokedex collection. */
    var csRow = row("s-off", "creationStorage", "waiting for SDK...", "warn");
    var tries = 0;
    (function waitCS() {
      var s = window.creationStorage && window.creationStorage.plain;
      if (s && s.getItem) {
        Promise.resolve(s.getItem(KEY)).then(function (prev) {
          var dec = null;
          if (prev) { try { dec = atob(prev); } catch (e) { dec = prev; } }
          var n = (parseInt(dec, 10) || 0) + 1;
          return Promise.resolve(s.setItem(KEY, btoa(String(n)))).then(function () {
            csRow.lastChild.textContent = dec
              ? "SURVIVED prev=" + dec + " now=" + n
              : "first launch (n=1)";
            csRow.lastChild.className = "v " + (dec ? "ok" : "warn");
          });
        }).catch(function (e) {
          csRow.lastChild.textContent = "err: " + (e && e.message || e);
          csRow.lastChild.className = "v bad";
        });
        return;
      }
      if (++tries > 160) {
        csRow.lastChild.textContent = "SDK never appeared";
        csRow.lastChild.className = "v bad";
        return;
      }
      setTimeout(waitCS, 50);
    })();
  })();

  /* ---------- viewport over time ---------- */
  (function () {
    var inIframe = false;
    try { inIframe = window.top !== window.self; } catch (e) { inIframe = true; }
    row("s-vp", "in iframe", yn(inIframe), inIframe ? "bad" : "ok");
    row("s-vp", "screen avail", screen.availWidth + "x" + screen.availHeight);
    try {
      row("s-vp", "orientation", (screen.orientation && screen.orientation.type) || "n/a");
    } catch (e) {}

    /* If the host reserves chrome (status bar, nav), it shows up as inset. */
    var pad = document.createElement("div");
    pad.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;" +
      "padding:env(safe-area-inset-top) env(safe-area-inset-right) " +
      "env(safe-area-inset-bottom) env(safe-area-inset-left);";
    document.body.appendChild(pad);
    var cs = getComputedStyle(pad);
    row("s-vp", "safe-area trbl",
        [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(" "));

    function snap() {
      var vv = window.visualViewport;
      return window.innerWidth + "x" + window.innerHeight +
             " doc" + document.documentElement.clientWidth + "x" +
             document.documentElement.clientHeight +
             (vv ? " vv" + Math.round(vv.width) + "x" + Math.round(vv.height) : "");
    }
    var prev = null;
    function sample(label) {
      var s = snap();
      row("s-vp", label, s, prev !== null && s !== prev ? "warn" : "");
      prev = s;
    }
    sample("t=0");
    [100, 500, 1500, 4000].forEach(function (ms) {
      setTimeout(function () { sample("t=" + ms); }, ms);
    });

    var n = 0;
    var rz = row("s-vp", "resizes", "0");
    function onResize() {
      n++;
      rz.lastChild.textContent = n + " -> " + snap();
      rz.lastChild.className = "v warn";
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", onResize);
    }
  })();

  /* ---------- injected globals ---------- */
  /* Diff window against a clean about:blank window. Anything present here and
     absent there was put there by the host — which finds the rabbit API
     surface by observation instead of by guessing at names. */
  (function () {
    var base = {};
    try {
      var f = document.createElement("iframe");
      f.style.cssText = "position:absolute;width:0;height:0;border:0;visibility:hidden";
      document.body.appendChild(f);
      Object.getOwnPropertyNames(f.contentWindow).forEach(function (k) { base[k] = 1; });
      document.body.removeChild(f);
    } catch (e) {
      row("s-inj", "baseline", "unavailable: " + e.message, "bad");
      return;
    }

    var injected = (window.__atStart || []).filter(function (k) {
      return !base[k] && k !== "__atStart";
    });
    row("s-inj", "host-injected", String(injected.length), injected.length ? "ok" : "bad");
    injected.slice(0, 40).forEach(function (k) {
      var detail;
      try {
        var v = window[k];
        detail = typeof v;
        if (detail === "object" && v) {
          var keys = [];
          for (var p in v) { keys.push(p); if (keys.length >= 8) { break; } }
          detail = "{" + keys.join(",") + "}";
        }
      } catch (e) { detail = "err"; }
      row("s-inj", k, detail, "ok");
    });
    if (injected.length > 40) {
      row("s-inj", "...", "+" + (injected.length - 40) + " more", "warn");
    }

    /* Anything appearing after our own script finishes is a late injection. */
    var settled = null;
    setTimeout(function () {
      settled = {};
      Object.getOwnPropertyNames(window).forEach(function (k) { settled[k] = 1; });
    }, 0);
    [1000, 3000, 6000].forEach(function (ms) {
      setTimeout(function () {
        if (!settled) { return; }
        var fresh = Object.getOwnPropertyNames(window).filter(function (k) {
          return !settled[k];
        });
        fresh.forEach(function (k) {
          settled[k] = 1;
          row("s-inj", "late@" + ms + " " + k, typeof window[k], "warn");
        });
      }, ms);
    });
  })();

  /* ---------- cpu benchmark ---------- */
  function matmul(n, iters) {
    var A = new Float32Array(n * n), B = new Float32Array(n * n), C = new Float32Array(n * n);
    for (var i = 0; i < n * n; i++) { A[i] = Math.random(); B[i] = Math.random(); }
    var t0 = performance.now();
    for (var it = 0; it < iters; it++) {
      for (var r = 0; r < n; r++) {
        var rn = r * n;
        for (var k = 0; k < n; k++) {
          var a = A[rn + k], kn = k * n;
          for (var col = 0; col < n; col++) C[rn + col] += a * B[kn + col];
        }
      }
    }
    var dt = performance.now() - t0;
    return { ms: dt, mflops: (2 * n * n * n * iters) / (dt * 1e3) };
  }

  document.getElementById("b-cpu").onclick = function () {
    var btn = this; btn.disabled = true; btn.textContent = "running…";
    setTimeout(function () {
      clear("s-cpu");
      matmul(64, 1); // warm the JIT
      var r = matmul(192, 2);
      row("s-cpu", "192^3 x2", r.ms.toFixed(0) + " ms");
      row("s-cpu", "throughput", r.mflops.toFixed(0) + " MFLOP/s");
      // BirdNET ~ 1.5 GFLOP per 3 s window (approx).
      var est = 1500 / r.mflops;
      var good = est < 3;
      row("s-cpu", "est. 3s chunk", "~" + est.toFixed(1) + " s", good ? "ok" : "warn");
      row("s-cpu", "realtime?", good ? "likely" : "marginal", good ? "ok" : "warn");
      var n = document.createElement("div");
      n.className = "note";
      n.textContent = "Scalar JS. WASM+SIMD typically 2-4x faster.";
      document.getElementById("s-cpu").appendChild(n);
      btn.textContent = "Re-run CPU benchmark"; btn.disabled = false;
    }, 60);
  };

  /* ---------- storage ---------- */
  document.getElementById("b-store").onclick = function () {
    var btn = this; btn.disabled = true; btn.textContent = "testing…";
    clear("s-store");

    function finish(msg, klass) {
      if (msg) row("s-store", "result", msg, klass);
      btn.textContent = "Re-test IndexedDB"; btn.disabled = false;
    }

    var quotaP = (navigator.storage && navigator.storage.estimate)
      ? navigator.storage.estimate()
      : Promise.resolve(null);

    quotaP.then(function (est) {
      if (est) {
        row("s-store", "quota", mb(est.quota || 0));
        row("s-store", "used", mb(est.usage || 0));
      } else {
        row("s-store", "quota", "unavailable", "warn");
      }
      if (navigator.storage && navigator.storage.persisted) {
        navigator.storage.persisted().then(function (p) {
          row("s-store", "persisted", yn(p), p ? "ok" : "warn");
        });
      }

      if (!window.indexedDB) { finish("no IndexedDB", "bad"); return; }

      var SIZE = 8 * 1048576;
      var blob = new Uint8Array(SIZE);
      for (var i = 0; i < SIZE; i += 4096) blob[i] = i & 255;

      var req = indexedDB.open("r1probe", 1);
      req.onupgradeneeded = function (e) { e.target.result.createObjectStore("kv"); };
      req.onerror = function () { finish("open failed", "bad"); };
      req.onsuccess = function (e) {
        var db = e.target.result, t0 = performance.now();
        var tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(blob, "model");
        tx.oncomplete = function () {
          var wms = performance.now() - t0, t1 = performance.now();
          var rtx = db.transaction("kv", "readonly");
          var g = rtx.objectStore("kv").get("model");
          g.onsuccess = function () {
            var rms = performance.now() - t1;
            var okLen = g.result && g.result.byteLength === SIZE;
            row("s-store", "write 8MB", wms.toFixed(0) + " ms");
            row("s-store", "read 8MB", rms.toFixed(0) + " ms");
            row("s-store", "integrity", okLen ? "ok" : "MISMATCH", cls(okLen));
            row("s-store", "est. 50MB write", (wms * 6.25 / 1000).toFixed(1) + " s");
            db.close();
            finish(null);
          };
          rtx.onerror = function () { db.close(); finish("read failed", "bad"); };
        };
        tx.onerror = function () { db.close(); finish("write failed (quota?)", "bad"); };
      };
    })["catch"](function (err) { finish(String(err), "bad"); });
  };

  /* ---------- audio ---------- */
  document.getElementById("b-audio").onclick = function () {
    var btn = this; btn.disabled = true; btn.textContent = "requesting…";
    clear("s-audio");

    var AC = window.AudioContext || window.webkitAudioContext;
    row("s-audio", "AudioWorklet", yn(AC && AC.prototype && "audioWorklet" in AC.prototype),
        cls(AC && AC.prototype && "audioWorklet" in AC.prototype));

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      row("s-audio", "getUserMedia", "absent", "bad");
      btn.textContent = "Test microphone"; btn.disabled = false;
      return;
    }

    // Ask for the pristine signal: no AGC/NS/AEC, which would mangle birdsong.
    navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        sampleRate: 48000,
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    }).then(function (stream) {
      var track = stream.getAudioTracks()[0];
      var st = track.getSettings ? track.getSettings() : {};
      row("s-audio", "granted", "yes", "ok");
      row("s-audio", "label", track.label || "(none)");
      row("s-audio", "sampleRate", (st.sampleRate || "?") + " Hz",
          st.sampleRate === 48000 ? "ok" : "warn");
      row("s-audio", "channels", String(st.channelCount || "?"));
      row("s-audio", "AGC", yn(st.autoGainControl), st.autoGainControl ? "warn" : "ok");
      row("s-audio", "noiseSupp", yn(st.noiseSuppression), st.noiseSuppression ? "warn" : "ok");
      row("s-audio", "echoCancel", yn(st.echoCancellation), st.echoCancellation ? "warn" : "ok");

      var ctx = new AC();
      row("s-audio", "ctx rate", ctx.sampleRate + " Hz",
          ctx.sampleRate === 48000 ? "ok" : "warn");

      // Confirm real samples are flowing, not silence.
      var src = ctx.createMediaStreamSource(stream);
      var an = ctx.createAnalyser();
      an.fftSize = 2048;
      src.connect(an);
      var buf = new Float32Array(an.fftSize);
      var peak = 0, frames = 0;
      var rowPeak = row("s-audio", "peak (2s)", "listening…");
      var iv = setInterval(function () {
        an.getFloatTimeDomainData(buf);
        for (var i = 0; i < buf.length; i++) {
          var v = Math.abs(buf[i]); if (v > peak) peak = v;
        }
        if (++frames > 20) {
          clearInterval(iv);
          var vEl = rowPeak.querySelector(".v");
          vEl.textContent = peak.toFixed(4) + (peak > 0.0005 ? " (signal)" : " (SILENT)");
          vEl.className = "v " + (peak > 0.0005 ? "ok" : "bad");
          track.stop(); ctx.close();
          btn.textContent = "Re-test microphone"; btn.disabled = false;
        }
      }, 100);
    })["catch"](function (err) {
      row("s-audio", "granted", "no", "bad");
      row("s-audio", "error", err && err.name ? err.name : String(err), "bad");
      btn.textContent = "Test microphone"; btn.disabled = false;
    });
  };

  /* ---------- camera ---------- */
  document.getElementById("b-cam").onclick = function () {
    var btn = this; btn.disabled = true;
    clear("s-cam");
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
      row("s-cam", "enumerate", "absent", "bad"); btn.disabled = false; return;
    }
    // Permission first, or labels come back blank.
    navigator.mediaDevices.getUserMedia({ video: true }).then(function (s) {
      var t = s.getVideoTracks()[0];
      var st = t.getSettings ? t.getSettings() : {};
      row("s-cam", "granted", "yes", "ok");
      row("s-cam", "resolution", (st.width || "?") + "x" + (st.height || "?"));
      row("s-cam", "facing", st.facingMode || "(unset)");
      t.stop();
      return navigator.mediaDevices.enumerateDevices();
    }).then(function (devs) {
      var vids = devs.filter(function (d) { return d.kind === "videoinput"; });
      row("s-cam", "cameras", String(vids.length));
      vids.forEach(function (d, i) { row("s-cam", "cam" + i, d.label || "(unlabeled)"); });
      btn.textContent = "Re-enumerate"; btn.disabled = false;
    })["catch"](function (err) {
      row("s-cam", "error", err && err.name ? err.name : String(err), "bad");
      btn.disabled = false;
    });
  };

  /* ---------- hardware events ---------- */
  var evt = document.getElementById("evt"), seen = {}, order = [];
  ["sideClick", "longPressStart", "longPressEnd", "scrollUp", "scrollDown"]
    .forEach(function (name) {
      window.addEventListener(name, function () {
        if (!seen[name]) { seen[name] = 0; order.push(name); }
        seen[name]++;
        evt.textContent = order.map(function (n) { return n + ":" + seen[n]; }).join("  ");
      });
    });
  window.addEventListener("keydown", function (e) {
    var n = "key:" + (e.key || e.keyCode);
    if (!seen[n]) { seen[n] = 0; order.push(n); }
    seen[n]++;
    evt.textContent = order.map(function (x) { return x + ":" + seen[x]; }).join("  ");
  });
})();
</script>
</body>
</html>
